# Propose dependency updates for human review; no auto-merge.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # NumPy 2.5 requires Python >=3.12; keep the reproducible Python 3.11 baseline.
    # Revisit this constraint after a separately validated Python upgrade.
    ignore:
      - dependency-name: "numpy"
        versions: [">=2.5"]
